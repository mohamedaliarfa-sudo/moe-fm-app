name: Build Moe FM Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies and sync Capacitor Android
        run: |
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Configure dark status and navigation bars
        run: |
          cat << 'EOF' > update_styles.py
          from pathlib import Path

          extras = (
              '\n        <item name="android:statusBarColor">#120e0b</item>'
              '\n        <item name="android:navigationBarColor">#120e0b</item>'
              '\n        <item name="android:windowLightStatusBar">false</item>'
              '\n        <item name="android:windowLightNavigationBar">false</item>'
              '\n    </style>'
          )

          for p in Path("android/app/src/main/res").rglob("styles.xml"):
              txt = p.read_text(encoding="utf-8")
              if "</style>" in txt and "statusBarColor" not in txt:
                  txt = txt.replace("</style>", extras, 1)
                  p.write_text(txt, encoding="utf-8")
          EOF
          python3 update_styles.py
          rm -f update_styles.py

      - name: Assemble Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moe-fm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
